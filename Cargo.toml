[package]
name = "irc-log-viewer"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Jérôme Poulin <jeromepoulin@gmail.com>"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "matched-path", "original-uri", "query"] }
clap = { version = "4", features = ["derive"] }
maud = { version = "0.27", features = ["axum"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2.1"
tokio = { version = "1", features = ["rt", "macros", "fs", "sync", "net", "signal", "time", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
percent-encoding = "2"
governor = { version = "0.10", default-features = false, features = ["std", "dashmap", "quanta"] }
cookie = "0.18"
getrandom = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
zstd = "0.14"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-zoneinfo", "serde"] }
arc-swap = "1"
tempfile = "3"
irc-proto = { version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
base64 = "0.23"
thiserror = "2"
ring = "0.17"
rcgen = "0.14"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Tests and iteration: optimised enough to run fast, no LTO so rebuilds stay
# incremental. `make release` keeps the size-optimised release profile.
[profile.quick]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = false
panic = "unwind"
